[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reverb-earnings"
version = "0.1.0"
description = "Evidence-first earnings trading research on Bitget"
requires-python = ">=3.11"
dependencies = ["scipy>=1.11", "numpy>=1.26", "pandas>=2.1", "httpx>=0.27", "pydantic>=2.9", "mcp>=2,<3"]

[tool.setuptools]
packages = ["reverb"]
